                    name: ΓΡΑΜΜΗ 3
                    name_en: null
                    color: "#0d5ca8"
                    text_color: "#ffffff"
                    source: stasy
                arrivals:
                  - {line: "stasy:M2", stop: "stasy:συνταγμα-metro", headsign: Ελληνικό, at: 1793205900, scheduled_at: 1793205900, delay_s: null, source: timetable, run: "stasy:run:1012345:2026-10-29", vehicle: null, vehicle_label: null, platform: null, status: scheduled}
                  - {line: "stasy:M3", stop: "stasy:συνταγμα-metro", headsign: Αεροδρόμιο, at: 1793206080, scheduled_at: 1793206080, delay_s: null, source: timetable, run: "stasy:run:1012401:2026-10-29", vehicle: null, vehicle_label: null, platform: null, status: scheduled}
                usual: []
