  /v1/lines/{line_id}/schedule:
    get:
      tags: [Lines]
      operationId: getLineSchedule
      summary: Timetable of a line for one day
      description: |
        The line's runs by direction and headsign: each run's departure from its first stop, GTFS
        style (past midnight `24:10`). Today's timetable is OASA's daily schedule when available
        (`source: oasa-daily`; an empty `trip` then, and for today `seen` says whether a bus was
        seen leaving the start for that run), else the OASA GTFS (`source: gtfs`), where for today
        `seen` says whether a bus of that run was matched. Other
        days are always from the GTFS. With an expired GTFS the same weekday inside the feed is
        used and `expired` is `true`. `Cache-Control: public, max-age=60`.
      parameters:
        - $ref: "#/components/parameters/LineId"
        - name: date
          in: query
          required: false
          description: Local date `YYYY-MM-DD`, today up to 7 days ahead. Default today.
          schema: {type: string, format: date}
      responses:
        "200":
          description: The timetable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineSchedule"
        "400":
          description: "`bad_date`: not a date, or outside today..today+7."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`unknown_line`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: the GTFS is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/stops/{stop_id}:
    get:
      tags: [Stops]
      operationId: getStop
      summary: A stop, its lines and the buses on their way to it
      description: |
        `lines` are the line numbers whose GTFS trips call at the stop. `arrivals`, soonest
        first, up to 1 h ahead, at most 3 per line and variant:
        - `source: live`: a bus of those lines that still has the stop ahead (not as the last
          stop of its trip), from GPS fixes of the last 5 minutes. Its time is its fix plus the
          driving time to the stop: typical speeds of the shape where the history has them,
          else the timetable's running time, else 3.5 m/s. A matched bus waiting at its first
          stop leaves at its scheduled departure; an unmatched bus is placed on its shape when
          the pass is clear (no `trip_id`, `scheduled` or delay), and left out while it stands
          at its first stop. A bus not past the stop by its last fix is never overdue: late, it
          is due now (`eta_s` 0).
        - `source: schedule`: a trip that has not left its first stop and has no bus yet
          (`vehicle` "", `delay_s` and `position_at` 0). None while the static GTFS is expired.

        Raises the polling priority of the stop's lines that have a live bus in `arrivals`, as
        a line request does; a line with none keeps its usual rate. No OASA request of its own.
        `Cache-Control: public, max-age=15` (`5` while `warming`).
      parameters:
        - name: stop_id
          in: path
          required: true
          description: GTFS `stop_id`, as in the static line files.
          schema: {type: string}
      responses:
        "200":
          description: The stop.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopArrivals"
        "404":
          description: "`unknown_stop`, or a path that is not clean (`not_found`)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: no GTFS loaded yet after a start."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/stops/{stop_id}/arrivals:
    get:
      tags: [Lines]
      operationId: getStopArrivals
      summary: Next buses at a stop (OASA's predictions)
      description: |
        OASA's own predictions (`getStopArrivals`), soonest first. They do not need a GTFS trip
        match. One OASA call per stop per 30 s: answers are cached 30 s and `Cache-Control` lasts
        until that cache expires (`public, max-age` 5-30). The calls share the server's OASA
        budget with the line polls and get at most one request slot in four, so they never slow
        the vehicle positions below three quarters of the budget. When OASA or the request queue
        cannot answer, the stop's last good answer up to 2 minutes old is served with its own
        `updated_at` and `max-age=5`.
      parameters:
        - name: stop_id
          in: path
          required: true
          description: GTFS `stop_id` (the OASA stop code), as in the static `lines/{id}.json` stops.
          schema: {type: string}
          example: "240084"
      responses:
        "200":
          description: Predictions, possibly empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopPredictions"
              example:
                stop_id: "240084"
                stop_name: "ΠΛ. ΔΑΒΑΚΗ"
                updated_at: 1793210650
                arrivals:
                  - {line: "5", route_code: "1992", vehicle: "88019", minutes: 28}
        "404":
          description: "`unknown_stop`: no such stop in the GTFS (OASA is not asked)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: "`upstream_unavailable`: OASA failed and no answer of the last 2 minutes is cached."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: |
            `warming_up`: the GTFS is not loaded yet. `busy`: the server's OASA request queue is
            full and no answer of the last 2 minutes is cached; try again shortly.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/stasy/departures:
    get:
      tags: [Rail]
      operationId: getStasyDepartures
      summary: Next metro and tram departures at a station (timetable)
      description: |
        From the STASY static GTFS (the open data catalogue), not live. The next `n` departures per
        line and headsign at every stop with that name (accents and case ignored).
        `indicative` is `true` when the date is outside the timetable's validity.
        `Cache-Control: public, max-age=30`.
      parameters:
        - name: stop
          in: query
          required: true
          description: Station name, e.g. `ΣΥΝΤΑΓΜΑ` or `Σύνταγμα`.
          schema: {type: string}
        - name: n
          in: query
          required: false
          description: Departures per line and headsign, 1-20. Default 6.
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: The departures, soonest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StasyDepartures"
        "400":
          description: "`missing_stop`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`unknown_stop`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: the timetable is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/stasy/vehicles:
    get:
      tags: [Rail]
      operationId: getStasyVehicles
      summary: Metro and tram trains running now (from the timetable)
      description: |
        No live data exists for the metro and tram: every train the STASY timetable runs now, with
        the stop it left (`from`, its departure `at`) and the next one (`to`, its arrival `at`), so a
        client moves it between them on its own clock. A train standing at a terminus is not listed.
        `indicative` as in the departures. `Cache-Control: public, max-age=15`.
      responses:
        "200":
          description: The trains, by line and trip.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StasyVehicles"
        "503":
          description: "`warming_up`: the timetable is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/stasy/trips/{id}:
    get:
      tags: [Rail]
      operationId: getStasyTrip
      summary: One metro or tram run with every stop and its time
      description: |
        Today's run of a trip of `/v1/rail/stasy/vehicles` (yesterday's, while an overnight run is
        still going). `Cache-Control: public, max-age=60`.
      parameters:
        - name: id
          in: path
          required: true
          description: The `trip` of a vehicle.
          schema: {type: string}
      responses:
        "200":
          description: The run.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StasyTrip"
        "404":
          description: "`unknown_trip`: no such trip, or it does not run today."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: the timetable is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/suburban/stations:
    get:
      tags: [Rail]
      operationId: getSuburbanStations
      summary: Suburban rail (Proastiakos) stations
      description: "From railway.gov.gr, cached 24 h. `Cache-Control: public, max-age=3600`."
      responses:
        "200":
          description: The stations with their corridors.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [stations]
                properties:
                  stations:
                    type: array
                    items: {$ref: "#/components/schemas/SuburbanStation"}
        "502":
          description: "`upstream_unavailable`: railway.gov.gr failed and nothing is cached."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/suburban/stations/{id}/departures:
    get:
      tags: [Rail]
      operationId: getSuburbanDepartures
      summary: Next suburban trains of a station (live)
      description: |
        From railway.gov.gr, with the ose.mpass station screens as fallback; boards cached 10 min.
        While the train stream is open (see `/v1/rail/suburban/vehicles`), `delay_min` is the live
        delay of the train. `Cache-Control: public, max-age=60`.
      parameters:
        - name: id
          in: path
          required: true
          description: Station id from `/v1/rail/suburban/stations`.
          schema: {type: string}
        - name: n
          in: query
          required: false
          description: Trains, 1-20. Default 10.
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: The next trains.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuburbanDepartures"
        "502":
          description: "`upstream_unavailable`: both sources failed and nothing is cached."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /static/v1/lines.json:
    servers:
      - url: https://angelospk.github.io/staseis-rt
        description: GitHub Pages
    get:
      tags: [Static data]
      operationId: getStaticLines
      summary: All lines
      responses:
        "200":
          description: Every line of the current GTFS (example trimmed to 2 lines).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaticLines"
              example:
                gtfs_version: "2026-07-08"
                lines:
                  - {id: "021", name: "ΠΛΑΤΕΙΑ ΚΑΝΙΓΓΟΣ - ΓΚΥΖH (ΚΥΚΛΙΚΗ)", name_en: "", color: "#153ce0", text_color: "#ffffff", kind: bus}
                  - {id: "022", name: "ΑΚΑΔΗΜΙΑ - Ν. ΚΥΨΕΛΗ (ΚΥΚΛΙΚΗ)", name_en: "", color: "#153ce0", text_color: "#ffffff", kind: bus}

  /static/v1/lines/{line_id}.json:
    servers:
      - url: https://angelospk.github.io/staseis-rt
        description: GitHub Pages
    get:
      tags: [Static data]
      operationId: getStaticLine
      summary: Variants, shapes and stops of one line
      description: |
        `variant` of a live vehicle keys into `variants`. Greek ids only (no Latin look-alikes
        here), percent-encoded: `Α1` is `%CE%911.json`.
      parameters:
        - name: line_id
          in: path
          required: true
          description: OASA line number, Greek uppercase, as in `lines.json`.
          schema:
            type: string
          example: "040"
      responses:
        "200":
          description: The line (example trimmed to one variant with 2 shape points and 2 stops).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaticLine"
              example:
                id: "040"
                variants:
                  "5512":
                    headsign: ΠΕΙΡΑΙΑΣ - ΣΥΝΤΑΓΜΑ(ΠΡΟΣΩΡΙΝΗ ΛΟΓΩ ΕΡΓΩΝ)
                    direction: 0
                    shape: [[37.93848, 23.63165], [37.93845, 23.63225]]
                    stops: ["10183", "400191"]
                stops:
                  "10183": {name: ΠΕΙΡΑΙΑΣ, lat: 37.93843, lon: 23.63188}
                  "400191": {name: ΚΛΕΙΣΟΒΗΣ, lat: 37.93532, lon: 23.63393}
        "404":
          description: No such line (GitHub Pages HTML error page).

  /v1/rail/suburban/vehicles:
    get:
      tags: [Rail]
      operationId: getSuburbanVehicles
      summary: Trains in service with their GPS positions (live)
      description: |
        From railway.gov.gr's train tracker stream, which the server reads only while clients ask
        (it closes 3 min after the last request). The positions come about once a second and are
        about 10 s old at the source; `position_at` is the time of each fix. Locomotives with no run
        are left out. Every corridor of Greece is listed, not only Attica. The first request after a
        quiet spell gets `503 warming_up` for a few seconds. `Cache-Control: public, max-age=5`.
      responses:
        "200":
          description: The trains, by train number.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuburbanVehicles"
        "503":
          description: "`warming_up`: no snapshot yet (or the last one is over 2 min old)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/suburban/trains/{no}:
    get:
      tags: [Rail]
      operationId: getSuburbanTrain
      summary: Today's run of a train with every stop and its time
      description: |
        From the day's board (cached 10 min): the run under way, else the next, else the last of the
        day. `t` is the scheduled arrival (the departure at the origin). `delay_min` of the run is the
        live delay while the stream is open. `Cache-Control: public, max-age=30`.
      parameters:
        - name: "no"
          in: path
          required: true
          description: The `train` of a vehicle or departure, e.g. `1226`.
          schema: {type: string}
      responses:
        "200":
          description: The run.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuburbanRun"
        "404":
          description: "`unknown_train`: no run of that number today."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: "`upstream_unavailable`: no board."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/lines:
    get:
      tags: [V2]
      operationId: getV2Lines
      summary: Every line of every mode
      description: |
        All Lines of every Source, all modes, sorted by `id`. One body for the whole network, so
        every client shares one cached copy. A Source that is still loading lists no line yet and
        says `warming_up` in `sources`; no card is blanked for it.

        `Cache-Control: public, max-age=3600`, weak `ETag`; `If-None-Match` gives `304`. A
        response with a Source `warming_up` or `down` is `max-age=5` with no `ETag`.
      responses:
        "200":
          description: The lines and the state of every Source.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinesResponse"
              example:
                lines:
                  - id: "oasa:040"
                    mode: bus
                    label: "040"
                    name: Πειραιάς – Σύνταγμα
                    name_en: Piraeus – Syntagma
                    color: "#0a6bb8"
                    text_color: "#ffffff"
                    source: oasa
                  - id: "stasy:M2"
                    mode: metro
                    label: "M2"
                    name: ΓΡΑΜΜΗ 2
                    name_en: null
                    color: "#d70f2b"
                    text_color: "#ffffff"
                    source: stasy
                  - id: "proastiakos:PIRAIR"
                    mode: suburban
                    label: null
                    name: Πειραιάς – Αεροδρόμιο
                    name_en: Piraeus – Airport
                    color: "#2e7d32"
                    text_color: "#ffffff"
                    source: proastiakos
                sources:
                  - {id: oasa, state: ok, updated_at: 1793205590}
                  - {id: stasy, state: ok, updated_at: 1793205500}
                  - {id: proastiakos, state: ok, updated_at: 1793205570}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/lines/{id}:
    get:
      tags: [V2]
      operationId: getV2Line
      summary: One line with its patterns and stops
      description: |
        The Line, its Patterns and every Stop those patterns call at, by Stop id, from one
        Source. `line` is `null` while that Source has not loaded yet (never `404` then): the
        answer carries `warming_up` in `sources` and empty `patterns` and `stops`.

        `Cache-Control: public, max-age=3600`, weak `ETag`; `If-None-Match` gives `304`. A
        response with a Source `warming_up` or `down` is `max-age=5` with no `ETag`.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Line id, namespaced and percent-encoded: `oasa:040`, `stasy:M1`,
            `proastiakos:KIATO`. An alias id answers with the current Line.
          schema: {type: string}
          example: "oasa:040"
      responses:
        "200":
          description: The line, its patterns and its stops. `patterns` and `stops` may be empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDetailResponse"
              example:
                line:
                  id: "oasa:040"
                  mode: bus
                  label: "040"
                  name: Πειραιάς – Σύνταγμα
                  name_en: Piraeus – Syntagma
                  color: "#0a6bb8"
                  text_color: "#ffffff"
                  source: oasa
                patterns:
                  - id: "oasa:2045"
                    headsign: Σύνταγμα
                    direction: 0
                    stops: ["oasa:400012", "oasa:400013"]
                    shape: [[37.942, 23.6466], [37.9431, 23.648]]
                stops:
                  "oasa:400012":
                    id: "oasa:400012"
                    name: Πλ. Καραϊσκάκη
                    name_en: null
                    lat: 37.942
                    lon: 23.6466
                    modes: [bus]
                    lines: ["oasa:040", "oasa:049"]
                    source: oasa
                  "oasa:400013":
                    id: "oasa:400013"
                    name: Γούναρη
                    name_en: null
                    lat: 37.9431
                    lon: 23.648
                    modes: [bus]
                    lines: ["oasa:040"]
                    source: oasa
                sources:
                  - {id: oasa, state: ok, updated_at: 1793205590}
        "404":
          description: "`unknown_line`, or a path that is not clean (`not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unknown_line
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/lines/{id}/vehicles:
    get:
      tags: [V2]
      operationId: getV2LineVehicles
      summary: Vehicles of one line
      description: |
        The vehicles of one Line now, whatever its mode, and when they are next checked. Asking
        for a line marks it "watched" (`oasa`: polled about every 30 s) and opens the stream
        (`proastiakos`). Refetch at `next_update_at`, not earlier.

        `Cache-Control: public, max-age=<seconds until next_update_at, 5..300>`, with a weak
        `ETag` and `304` when that is at least 60 s. A response with a Source `warming_up` or
        `down` is `max-age=5` with no `ETag`.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Line id, namespaced and percent-encoded: `oasa:040`, `stasy:M1`,
            `proastiakos:KIATO`. An alias id answers with the current Line.
          schema: {type: string}
          example: "stasy:M2"
      responses:
        "200":
          description: The line and its vehicles. `vehicles` may be `[]`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineVehiclesResponse"
              example:
                line: "stasy:M2"
                updated_at: 1793205600
                next_update_at: 1793205615
                vehicles:
                  - id: "stasy:run:1012345:2026-10-29"
                    line: "stasy:M2"
                    run: "stasy:run:1012345:2026-10-29"
                    mode: metro
                    headsign: Ελληνικό
                    label: null
                    position: {kind: estimate, lat: 37.9722, lon: 23.7325, bearing: 205, at: 1793205600}
                    delay_s: null
                    next_stop: "stasy:ακροπολη-metro"
                    direction: 0
                    motion:
                      path: [[37.9722, 23.7325], [37.96882, 23.72963]]
                      path_beyond: [[37.96882, 23.72963], [37.96421, 23.72651]]
                      path_stops: [450, 1010]
                      speed: null
                      path_speeds: null
                      knots: [[0, 1793205600], [450, 1793205660], [450, 1793205690], [1010, 1793205760]]
                    source: stasy
                sources:
                  - {id: stasy, state: ok, updated_at: 1793205600}
        "404":
          description: "`unknown_line`, or a path that is not clean (`not_found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unknown_line
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/stops:
    get:
      tags: [V2]
      operationId: getV2Stops
      summary: Every stop of every mode, compact
      description: |
        Every Stop of every Source as a 6-item array `[id, name, lat, lon, modes, lines]`, sorted
        by `id`: about 9000 stops, under 250 KB gzip. A client filters it by name and by the box
        it shows; the full Stop is at `/v2/stops/{id}`.

        `Cache-Control: public, max-age=3600` and a strong `ETag`; `If-None-Match` gives `304`.
        Keep the index and send its `ETag` back: it holds while the stops and the Source states
        stay the same (an `ok` Source's `updated_at` does not change it, so the body carries the
        `updated_at` of its build). A response with a Source `warming_up` or `down` is
        `max-age=5` with no `ETag`.
      responses:
        "200":
          description: The index and the state of every Source.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopsResponse"
              example:
                stops:
                  - ["oasa:400012", Πλ. Καραϊσκάκη, 37.942, 23.6466, [bus], ["oasa:040", "oasa:049"]]
                  - ["stasy:συνταγμα-metro", Σύνταγμα, 37.97527, 23.73552, [metro], ["stasy:M2", "stasy:M3"]]
                sources:
                  - {id: oasa, state: ok, updated_at: 1793205590}
                  - {id: stasy, state: ok, updated_at: 1793205500}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/stops/{id}:
    get:
      tags: [V2]
      operationId: getV2Stop
      summary: One stop, its lines and the arrivals
      description: |
        The Stop, the Lines that call there and the arrivals, soonest first: at most 2 h ahead,
        at most 4 per Line and headsign, at most 30 in all. `source: live` when GPS or a reported
        delay set `at`, `timetable` otherwise; a Run not started yet is listed with `vehicle`
        `null`. `stop` is `null` while its Source has not loaded yet (never `404` then).

        Raises the priority of the stop's lines (`oasa`) and opens the stream (`proastiakos`).
        `Cache-Control: public, max-age=15`; no `ETag` (cached 15 s or less). A response with a
        Source `warming_up` or `down` is `max-age=5`.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Stop id, namespaced and percent-encoded: `oasa:400012`, `stasy:συνταγμα-metro`
            (`%CF%83…` in a URL), `proastiakos:<station id>`. An alias id answers with the
            current Stop.
          schema: {type: string}
          example: "stasy:συνταγμα-metro"
      responses:
        "200":
          description: The stop, its lines, the arrivals and the state of its Source.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopDetailResponse"
              example:
                stop:
                  id: "stasy:συνταγμα-metro"
                  name: Σύνταγμα
                  name_en: Syntagma
                  lat: 37.97527
                  lon: 23.73552
                  modes: [metro]
                  lines: ["stasy:M2", "stasy:M3"]
                  source: stasy
                lines:
                  - id: "stasy:M2"
                    mode: metro
                    label: "M2"
