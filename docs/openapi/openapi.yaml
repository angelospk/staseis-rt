  /v2/runs/{id}:
    get:
      tags: [V2]
      operationId: getV2Run
      summary: One run with every stop and its time
      description: |
        Any Run of the service day, started or not: `vehicle` is `null` before it starts. It
        replaces `/v1/rail/stasy/trips/{id}` and `/v1/rail/suburban/trains/{no}` for the line
        card. `oasa`: the matched trip's stops, timetable plus the observed delay. Outside the
