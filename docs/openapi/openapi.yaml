  /v2/vehicles/tiles/{z}/{x}/{y}:
    get:
      tags: [V2]
      operationId: getV2VehicleTile
      summary: Vehicles of one map tile
      description: |
        The `/v2/vehicles` snapshot cut into XYZ (Web Mercator, "slippy map") tiles, so a map
        loads only what it shows. Same build, `updated_at` and `next_update_at` as
        `/v2/vehicles`. Each vehicle is in the one tile of its position.

        | `z` | tile size | content | for MapLibre zoom |
        |---|---|---|---|
        | `9` | ~62 km | `LiteVehicle` entries: the `motion` key is absent | < 13 |
        | `13` | ~3.9 km | the same entries as `/v2/vehicles` | ≥ 13 |

        Tiles exist for lat 37.5..38.5, lon 22.9..24.5: `z` 9 x 288..290, y 196..198; `z` 13
        x 4617..4653, y 3145..3174. A tile in that box with no vehicle gives `200` with
        `"vehicles":[]`. Tile of a point (`n = 2^z`): `x = floor((lon + 180) / 360 × n)`,
        `y = floor((1 − asinh(tan(lat × π/180)) / π) / 2 × n)`.

        Use plain URLs: any query string gives `400`, so every client shares the cached copy.
        Headers as `/v2/vehicles`.
      parameters:
        - name: z
          in: path
          required: true
          description: Zoom level, `9` or `13`.
          schema:
            type: integer
            enum: [9, 13]
          example: 13
        - name: x
          in: path
          required: true
          description: Tile column (`z` 9 288..290, `z` 13 4617..4653), plain decimal.
          schema:
            type: integer
            minimum: 288
            maximum: 4653
          example: 4636
        - name: y
          in: path
          required: true
          description: Tile row (`z` 9 196..198, `z` 13 3145..3174), plain decimal.
          schema:
            type: integer
            minimum: 196
            maximum: 3174
          example: 3160
      responses:
        "200":
          description: Vehicles in the tile (Syntagma area in the example).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TileResponse"
              examples:
                z13:
                  summary: z 13 (Vehicle entries)
                  value:
                    updated_at: 1793205586
                    next_update_at: 1793205616
                    vehicles:
                      - id: "oasa:88012"
                        line: "oasa:11"
                        run: "oasa:run:4913_day_2_0900_1010:2026-10-29"
                        mode: trolley
                        headsign: Πλ. Βαθης
                        label: "88012"
                        position: {kind: gps, lat: 37.9884, lon: 23.73051, bearing: 12, at: 1793205488}
                        delay_s: 1158
                        next_stop: "oasa:400111"
                        direction: 0
                        motion:
                          path: [[37.9884, 23.73054], [37.98917, 23.73072]]
                          path_beyond: [[37.98917, 23.73072], [37.99708, 23.73271]]
                          path_stops: [87, 572, 984]
                          speed: 3.6
                          path_speeds: [3.5, 3.5, 3.7, 3.9]
                          knots: null
                        source: oasa
                    sources:
                      - {id: oasa, state: ok, updated_at: 1793205586}
                z9:
                  summary: z 9 (no motion)
                  value:
                    updated_at: 1793205586
                    next_update_at: 1793205616
                    vehicles:
                      - id: "oasa:88012"
                        line: "oasa:11"
                        run: "oasa:run:4913_day_2_0900_1010:2026-10-29"
                        mode: trolley
                        headsign: Πλ. Βαθης
                        label: "88012"
                        position: {kind: gps, lat: 37.9884, lon: 23.73051, bearing: 12, at: 1793205488}
                        delay_s: 1158
                        next_stop: "oasa:400111"
                        direction: 0
                        source: oasa
                    sources:
                      - {id: oasa, state: ok, updated_at: 1793205586}
        "304":
          description: Not modified (the request had a matching `If-None-Match`).
        "400":
          description: "The URL has a query string (even a bare `?`). `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: query_not_allowed
        "404":
          description: |
            Any other `z`, `x`/`y` outside the box, numbers not in plain decimal (`04636`,
            `+4636`), or a trailing `/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "429":
          $ref: "#/components/responses/RateLimited"

