              example:
                error: unknown_run
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/plan:
    get:
      tags: [V2]
      operationId: getV2Plan
      summary: Trips from a point to a point, with transfers (rev 16)
      description: |
        Contract §9. A walk to a Stop, one to four rides of any Mode with walks between them, and
        a walk to `to`, from the timetables only (`source: timetable`): no live delays. Options
        that another one dominates (it leaves at the same time or later, arrives at the same time
        or earlier, with no more transfers) are left out. `last=true`: the last `n` options of the
        service day (03:00 to 03:00 Athens time); else the first `n`, at most 3 h past `after`.
        Sorted by `depart_at`, then `arrive_at`, then `transfers`. Every ride's `run` opens with
        `/v2/runs/{id}` until 03:00 after its service day.

        Walks: straight line × 1.3 at 1.2 m/s, rounded up; 120 s more at a metro or suburban Stop.
        Walks to and from the points: Stops up to 1000 m away; between rides: up to 500 m; at
        least 60 s of waiting before each ride after the first.

        `Cache-Control: public, max-age=60`; `max-age=5` when a Source is `warming_up` or `down`,
        or before the planner's first timetable is built (then `itineraries: []`). No `ETag`.
        Clients round `from` and `to` to 4 decimals and `after` to the minute.
      parameters:
        - name: from
          in: query
          required: true
          description: "`lat,lon`, decimal degrees, inside Attica (lat 37.6-38.4, lon 23.2-24.2)."
          schema: {type: string}
          example: "37.97527,23.73552"
        - name: to
          in: query
          required: true
          description: "`lat,lon`, as `from`."
          schema: {type: string}
          example: "37.87390,23.75400"
        - name: after
          in: query
          description: |
            Unix seconds; default now. No option leaves `from` before it. Before the end of the
            current service day, and in it or at most 1 h before now.
          schema: {type: integer, format: int64}
          example: 1793227800
        - name: last
          in: query
          description: "`true`: the last `n` options of the service day. Default `false`."
          schema: {type: boolean}
        - name: n
          in: query
          description: Options to return, 1-5; default 3.
          schema: {type: integer, minimum: 1, maximum: 5}
      responses:
        "200":
          description: |
            The options (fewer than `n`, or none, when fewer exist), the walk when the points are
            at most 1000 m apart, every Line and Stop a leg names, and all three Sources.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
              example:
                service_day: "2026-11-03"
                from: {lat: 37.97527, lon: 23.73552}
                to: {lat: 37.8739, lon: 23.754}
                after: 1793227800
                last: true
                itineraries:
                  - depart_at: 1793230200
                    arrive_at: 1793231859
                    duration_s: 1659
                    transfers: 0
                    walk_m: 515
                    modes: [metro]
                    legs:
                      - {kind: walk, from: {stop: null, lat: 37.97527, lon: 23.73552}, to: {stop: "stasy:συνταγμα-metro", lat: 37.97527, lon: 23.73552}, depart_at: 1793230200, arrive_at: 1793230320, distance_m: 0, shape: [[37.97527, 23.73552], [37.97527, 23.73552]]}
                      - {kind: ride, line: "stasy:M2", mode: metro, headsign: Ελληνικό, run: "stasy:run:1012345:2026-11-03", from: {stop: "stasy:συνταγμα-metro", lat: 37.97527, lon: 23.73552}, to: {stop: "stasy:ελληνικο-metro", lat: 37.8926, lon: 23.7471}, depart_at: 1793230320, arrive_at: 1793231340, hops: 10, source: timetable, shape: [[37.97527, 23.73552], [37.9681, 23.729], [37.8926, 23.7471]]}
                      - {kind: walk, from: {stop: "stasy:ελληνικο-metro", lat: 37.8926, lon: 23.7471}, to: {stop: null, lat: 37.8739, lon: 23.754}, depart_at: 1793231340, arrive_at: 1793231859, distance_m: 515, shape: [[37.8926, 23.7471], [37.8739, 23.754]]}
                walk_only: null
                lines: {}
                stops: {}
                sources:
                  - {id: oasa, state: ok, updated_at: 1793227790}
                  - {id: stasy, state: ok, updated_at: 1793205600}
                  - {id: proastiakos, state: ok, updated_at: 1793227500}
        "400":
          description: |
            `bad_from`, `bad_to` (not `lat,lon`), `outside_area` (a point outside Attica),
            `bad_after` (not Unix seconds, or outside the allowed span), `bad_n` (not 1-5).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: outside_area
        "429":
          description: |
            `busy`: two plans are running and none finished within 2 s (a plan costs CPU; the
            other endpoints are not slowed). `Retry-After: 2`. Or, from Cloudflare, the rate limit
            (see the other operations).
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: busy

  /v2/alerts:
    get:
      tags: [V2]
      operationId: getV2Alerts
      summary: Service disruptions (rev 13)
      description: |
        Service disruptions from two sources, polled in the background every 10 min: OASA
        notices (`source: oasa`, buses and trolleys, with the Line ids and Stop codes the GTFS
        knows and the dates of the notice) and strikes from athenstransport.com
        (`source: athenstransport`, every mode). An Alert is listed for 7 days after
        `published`, or until `until` when that is later; newest first. A source that fails
        keeps its last Alerts. `from`/`until` are Athens dates (`YYYY-MM-DD`), `null` when the
        notice names none: clients show an Alert from `from` to `until`, and 3 days after
        `published` when it has no dates. Always link `url`.

        `Cache-Control: public, max-age=300` after the first poll with no failure; before it
        `max-age=5`, `alerts: []` and `updated_at: null`. No `ETag` and no `sources`.
      responses:
        "200":
          description: The Alerts now, and when both sources were last polled without a failure.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsResponse"
              example:
                alerts:
                  - id: "oasa:14909"
                    source: oasa
                    title: Μερική προσωρινή τροποποίηση της λεωφορειακής γραμμής 112 στον Δήμο Αγ. Δημητρίου
                    url: "https://www.oasa.gr/blog/%ce%bc%ce%b5%cf%81%ce%b9%ce%ba%ce%ae-381/"
                    published: 1793336520
                    from: "2026-10-31"
                    until: "2026-11-01"
                    modes: [bus]
                    lines: ["oasa:112"]
                    stops: ["oasa:40054"]
                    urgent: false
                updated_at: 1793336580
        "429":
          $ref: "#/components/responses/RateLimited"

  /v2/municipal:
    get:
      tags: [V2]
      operationId: getV2Municipal
      summary: Municipal bus routes from OpenStreetMap (rev 18)
      description: |
        The bus routes that municipalities run (δημοτική συγκοινωνία), which are not in the OASA
        GTFS: OSM route relations whose operator is a «Δήμος», read from the Overpass API at
        start and then every 7 days (hourly after a failure). No timetable and no live data:
        clients link `timetable_url`, the municipality's own page. Data © OpenStreetMap
        contributors, ODbL: show `attribution` with the layer.

        After the first good poll: `Cache-Control: public, max-age=86400` and an `ETag`
        (`If-None-Match` → `304`). Before it: `routes: []`, `stops: {}`, `updated_at: null`,
        `max-age=5` and no `ETag`. No `sources`.
      responses:
        "200":
          description: Every municipal route and its stops.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalResponse"
              example:
                routes:
                  - id: "osm:r20462642"
                    ref: Β1
                    name: "Δημοτικό Λεωφορείο Β1: Πολύδροσο → Κοιμητήριο"
                    municipality: Δήμος Χαλανδρίου
                    timetable_url: "https://www.chalandri.gr/yphresies/ypodomes-erga/dimotiki-sygkoinonia/"
                    shape: [[[38.02, 23.8], [38.03, 23.81]]]
                    stops: ["osm:n201", "osm:n203"]
                stops:
                  "osm:n201": {name: Πολύδροσο, lat: 38.02, lon: 23.8}
                  "osm:n203": {name: Κοιμητήριο, lat: 38.03, lon: 23.81}
                updated_at: 1793793600
                attribution: © OpenStreetMap contributors (ODbL)
        "304":
          description: Not modified (`If-None-Match` matched the `ETag`).
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  parameters:
    LineId:
      name: line_id
      in: path
      required: true
      description: |
        OASA line number in Greek uppercase (`040`, `550`, `Α1`, `Χ96`), percent-encoded.
        Latin look-alikes also work (`A1` → `Α1`).
      schema:
        type: string
      example: "040"

  headers:
    CacheControl:
      description: "`public, max-age=<seconds>`; see the operation for the value."
      schema:
        type: string
    ETag:
      description: Version of the snapshot body. Send it back in `If-None-Match` for `304`.
      schema:
        type: string

  responses:
    RateLimited:
      description: |
        From Cloudflare: more than about 30 requests per 10 s from one IP. Wait at least 10 s.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [unknown_line, not_found, warming_up, feed_unavailable, query_not_allowed, bad_date, internal, missing_stop, unknown_stop, unknown_trip, unknown_train, upstream_unavailable, busy, unknown_run, bad_from, bad_to, bad_after, bad_n, outside_area]

    LatLon:
      type: array
      description: "`[lat, lon]`, 5 decimals."
      prefixItems:
        - type: number
          minimum: -90
          maximum: 90
        - type: number
          minimum: -180
          maximum: 180
      minItems: 2
      maxItems: 2

    Motion:
      description: Fields shared by every vehicle entry with paths.
      type: object
      properties:
        speed:
          type: [number, "null"]
          minimum: 0
          maximum: 20
          description: |
            Smoothed speed along the route in m/s, one decimal. `0` = standing. `null` when
            unknown (first sighting, long gap, ambiguous position, more than 150 m from the shape).
        path:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            The route ahead, from the vehicle's point on its shape (at `position_at`) to its next
            stop when matched, otherwise `max(speed × 150 s, 300 m)` ahead; at most 1.5 km.
            `null` when there is nothing to move along.
        path_beyond:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            Matched vehicles only: the route on from the end of `path` to the third stop ahead
            (at most 1.5 km from the vehicle). Its first point is the last point of `path`.
        path_stops:
          type: [array, "null"]
          items:
            type: integer
            minimum: 0
          description: |
            The stops on `path` followed by `path_beyond`, as whole metres along those points,
            ascending. `null` when not matched or no stop is on them.
        path_speeds:
          type: [array, "null"]
          maxItems: 8
          items:
            type: [number, "null"]
            minimum: 0.1
          description: |
            Typical speed ahead in m/s for consecutive 200 m steps (step `i` covers metres
            `200·i` to `200·(i+1)`), from the last 14 days of fixes on the same shape, day type
            and local hour. A step with no history is `null`. `null` when unmatched or unknown.
        along_m:
          type: [integer, "null"]
          minimum: 0
          description: |
            Rev 20: whole metres along the static shape of `variant` at `position_at` (where
            `path` starts), in the unit of the variant's `length_m` in
            `/static/v1/lines/{line_id}.json`. `null` when the vehicle is not placed on that shape
            (no variant, more than 150 m from it, ambiguous position on a loop, waiting at its first stop). Clients move the
            marker along the static shape from here (CONTRACT.md, "Along the static shape").

    VehicleBase:
      type: object
      required: [id, lat, lon, bearing, position_at, variant, delay_s]
      properties:
        id:
          type: string
          description: OASA vehicle number.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        bearing:
          type: [number, "null"]
          minimum: 0
          maximum: 360
          description: Degrees clockwise from north. `null` when unknown.
        position_at:
          type: integer
          description: Time of the GPS fix (Unix seconds).
        variant:
          type: [string, "null"]
          description: |
            Shape id; keys into `variants` of `/static/v1/lines/{line_id}.json`. `null` when no
            static variant matches.
        delay_s:
          type: [integer, "null"]
          description: Delay against the schedule in seconds (negative = early). `null` when not matched to a trip.

    LineVehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - $ref: "#/components/schemas/Motion"
        - type: object
          required: [route_code, trip_id, trip_label, next_stop_id, speed, path, path_beyond, path_stops, path_speeds, along_m]
          properties:
            route_code:
              type: string
              description: OASA route code of the vehicle's current route.
            trip_id:
              type: [string, "null"]
              description: GTFS `trip_id` of the matched trip, `null` when not matched.
            trip_label:
              type: [string, "null"]
              description: Departure time and direction, e.g. `00:15 ΣΥΝΤΑΓΜΑ → ΠΕΙΡΑΙΑΣ`.
            next_stop_id:
              type: [string, "null"]
              description: GTFS `stop_id` of the next stop.
            at_terminus:
              type: boolean
              description: |
                Rev 9: `true` when matched and waiting at the first stop of its trip (its
                `delay_s` is a departure delay). Missing in older responses: treat as `false`.

    CityVehicle:
      description: A vehicle of `/v1/vehicles` or a `z` 13 tile.
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - $ref: "#/components/schemas/Motion"
        - type: object
          required: [line, speed, path, path_beyond, path_stops, path_speeds, along_m]
          properties:
            line:
              type: string
              description: Line id.

    CityVehicleLite:
      description: A vehicle of a `z` 9 tile. The keys `path`, `path_beyond`, `path_stops`, `path_speeds`, `along_m` are absent.
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - type: object
          required: [line, speed]
          properties:
            line:
              type: string
              description: Line id.
            speed:
              $ref: "#/components/schemas/Motion/properties/speed"

    LineResponse:
      type: object
      required: [line, updated_at, next_update_at, vehicles]
      properties:
        line:
          type: string
          description: Canonical (Greek) line id.
        updated_at:
          type: integer
          description: Time of the poll that gave this data.
        next_update_at:
          type: integer
          description: Earliest time new data can exist. Refetch then, not earlier.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/LineVehicle"

    VehiclesResponse:
      type: object
      required: [updated_at, next_update_at, vehicles]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot.
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/CityVehicle"

    TileResponse:
      type: object
      required: [updated_at, next_update_at, vehicles]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot (the same as `/v1/vehicles`).
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          description: "`CityVehicle` entries in `z` 13 tiles, `CityVehicleLite` entries in `z` 9 tiles."
          items:
            anyOf:
              - $ref: "#/components/schemas/CityVehicle"
              - $ref: "#/components/schemas/CityVehicleLite"

    Status:
      type: object
      required: [ok, gtfs_version, gtfs_expires, updated_at, lines_active, budget_rps]
      properties:
        ok:
          type: boolean
          description: "`false` when no line poll succeeded in the last 5 minutes."
        gtfs_version:
          type: string
          description: Version (start date) of the static GTFS in use.
        gtfs_expires:
          type: string
          description: Last service date of that GTFS.
        updated_at:
          type: integer
          description: Time of the last published poll (0 before the first one).
        lines_active:
          type: integer
          description: Lines with scheduled service now.
        budget_rps:
          type: number
          description: OASA requests per second the poller may use.

    GtfsRtFeed:
      type: object
      description: |
        A GTFS-Realtime `FeedMessage` in protobuf JSON. Only the fields this server sets are
        listed; see the [GTFS-RT reference](https://gtfs.org/documentation/realtime/reference/).
      required: [header]
      properties:
        header:
          type: object
          required: [gtfsRealtimeVersion, incrementality, timestamp]
          properties:
            gtfsRealtimeVersion:
              type: string
            incrementality:
              const: FULL_DATASET
            timestamp:
              type: string
              pattern: "^[0-9]+$"
        entity:
          type: array
          description: Absent when the feed has no entity (protobuf JSON omits empty lists).
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              vehicle:
                type: object
                properties:
                  trip:
                    $ref: "#/components/schemas/GtfsRtTrip"
                  vehicle:
                    type: object
                    properties:
                      id: {type: string}
                      label: {type: string}
                  position:
                    type: object
                    required: [latitude, longitude]
                    properties:
                      latitude: {type: number}
                      longitude: {type: number}
                      bearing: {type: number}
                  currentStopSequence: {type: integer}
                  stopId: {type: string}
                  currentStatus: {type: string, enum: [IN_TRANSIT_TO, STOPPED_AT]}
                  timestamp: {type: string, pattern: "^[0-9]+$"}
              tripUpdate:
                type: object
                required: [trip, stopTimeUpdate]
                properties:
                  trip:
                    $ref: "#/components/schemas/GtfsRtTrip"
                  vehicle:
                    type: object
                    properties:
                      id: {type: string}
                  stopTimeUpdate:
                    type: array
                    items:
                      type: object
                      properties:
                        stopSequence: {type: integer}
                        stopId: {type: string}
                        arrival:
                          description: Set while the vehicle is on its way to the stop.
                          type: object
                          properties:
                            delay: {type: integer}
                        departure:
                          description: Set instead of `arrival` while the vehicle waits at its first stop.
                          type: object
                          properties:
                            delay: {type: integer}
                        scheduleRelationship: {type: string}
                  timestamp: {type: string, pattern: "^[0-9]+$"}

    GtfsRtTrip:
      type: object
      required: [routeId]
      properties:
        tripId: {type: string}
        routeId: {type: string}
        startDate: {type: string, pattern: "^[0-9]{8}$"}
        scheduleRelationship: {type: string}

    StatsIndex:
      type: object
      required: [version, latest, days]
      properties:
        version:
          type: integer
          const: 1
        latest:
          type: string
          format: date
        days:
          type: array
          items:
            type: string
            format: date

    StatsDay:
      type: object
      required: [version, date, tz, generated_at, first_fix, last_fix, files, fixes, vehicles, lines, hours, by_line]
      properties:
        version:
          type: integer
          const: 1
        date:
          type: string
          format: date
        tz:
          type: string
          example: Europe/Athens
        generated_at:
          type: integer
          description: When the file was written.
        first_fix:
          type: integer
          description: First fix time of the day (0 when the day has no fix).
        last_fix:
          type: integer
          description: Last fix time of the day.
        files:
          type: integer
          description: History archives read.
        fixes:
          type: integer
          description: GPS fixes.
        vehicles:
          type: integer
          description: Distinct vehicles that sent a fix (depends on polling).
        lines:
          type: integer
          description: Distinct lines.
        hours:
          type: array
          description: 24 entries, index = local hour.
          minItems: 24
          maxItems: 24
          items:
            type: object
            required: [h, fixes, vehicles, lines, dist_m, time_s]
            properties:
              h: {type: integer, minimum: 0, maximum: 23}
              fixes: {type: integer}
              vehicles: {type: integer}
              lines: {type: integer}
              dist_m: {type: integer, description: Metres driven in the speed samples.}
              time_s: {type: integer, description: Seconds of the speed samples.}
        by_line:
          type: array
          description: Every line with a fix, by id.
          items:
            type: object
            required: [line, fixes, vehicles, dist_m, time_s]
            properties:
              line: {type: string}
              fixes: {type: integer}
              vehicles: {type: integer}
              dist_m: {type: integer}
              time_s: {type: integer}
        trips:
          type: object
          description: |
            Scheduled trips that start in the day (static GTFS) and how many ran. A trip ran when
            the vehicles matched to it covered at least `min_coverage` of its shape between 30 min
            before its start and 30 min after its end. Missing when the server had no static GTFS
            of the day's history. `run + partial + missed + unmeasured = planned`.
          required: [gtfs, gtfs_expired, min_coverage, planned, run, partial, missed, unmeasured, by_line]
          properties:
            gtfs: {type: string, description: Static GTFS version the trips come from.}
            gtfs_expired:
              type: boolean
              description: The day is outside the feed's validity. Lines with an archived OASA daily schedule are planned from it (schedule_source); the others take the trips of the same weekday inside the feed.
            schedule_source:
              type: string
              enum: [oasa_daily, gtfs, mixed]
              description: Where the planned trips come from (some lines each for mixed). Missing on days written before 2026-11.
            min_coverage: {type: number, example: 0.5}
            planned: {type: integer}
            run: {type: integer, description: Covered at least min_coverage.}
            partial: {type: integer, description: "Seen, but covered less."}
            missed: {type: integer, description: Never seen.}
            unmeasured: {type: integer, description: No usable shape.}
            by_line:
              type: array
              description: Every line with a planned trip, by id.
              items:
                type: object
                required: [line, planned, run, partial, missed, unmeasured, missed_trips]
                properties:
                  line: {type: string}
                  schedule_source: {type: string, enum: [oasa_daily, gtfs], description: "Where this line's planned trips come from; missing on days written before 2026-11."}
                  planned: {type: integer}
                  run: {type: integer}
                  partial: {type: integer}
                  missed: {type: integer}
                  unmeasured: {type: integer}
                  missed_trips:
                    type: [array, "null"]
                    description: "Never seen, by start time: GTFS trip_ids (gtfs), or `go HH:MM` / `come HH:MM` runs (oasa_daily)."
                    items: {type: string}
        start_delay:
          type: object
          description: |
            How late the runs of OASA's daily schedule left their first stop (contract rev 17), for
            buses seen leaving on a clear run while the static GTFS is expired. A run counts once,
            for the day of its scheduled departure. Missing when no run of the day was measured.
          required: [runs, by_line]
          properties:
            runs: {type: integer, description: "Runs measured, all lines."}
            by_line:
              type: array
              description: Every line with a measured run, by id.
              items:
                type: object
                required: [line, runs, mean_s, p90_s, sum_s, minutes]
                properties:
                  line: {type: string}
                  runs: {type: integer}
                  mean_s: {type: integer, description: Mean start delay in seconds (rounded; negative is early).}
                  p90_s: {type: integer, description: "90th percentile, nearest rank, seconds."}
                  sum_s: {type: integer, description: Sum of the start delays in seconds (days add up).}
                  minutes:
                    type: array
                    description: "Histogram by minute: [floor(delay / 60), runs] pairs."
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items: {type: integer}
                    example: [[-1, 1], [1, 1], [3, 1], [10, 1]]
        headways:
          type: object
          description: |
            Regularity (headway adherence) of the high-frequency lines of OASA's daily schedule: one
            entry per direction with at least 8 headways from 07:00 to 21:00 local at mid-route and a
            median observed headway of at most 720 s. Missing when no direction qualifies.
          required: [from_h, to_h, at, by_line]
          properties:
            from_h: {type: integer}
            to_h: {type: integer}
            at: {type: number, description: "Share of the route where passes are taken (0.5)."}
            by_line:
              type: array
              items:
                type: object
                required: [line, dir, n, ref_headway_median_s, mean_headway_s, cv_h, ewt_min, los]
                properties:
                  line: {type: string}
                  dir: {type: integer, description: "0 Go, 1 Come."}
                  n: {type: integer, description: Headways measured.}
                  ref_headway_median_s: {type: integer, description: Median observed headway (the reference).}
                  mean_headway_s: {type: integer}
                  cv_h: {type: number, description: "stddev(headway) / ref_headway_median_s."}
                  ewt_min: {type: number, description: "Excess wait time, minutes: sum(h^2)/(2 sum(h)) - ref/2."}
                  los: {type: string, enum: [A, B, C, D, E, F], description: "TCQSM headway-adherence LOS of cv_h."}

    StaticLines:
      type: object
      required: [gtfs_version, lines]
      properties:
        gtfs_version:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [id, name, name_en, color, text_color, kind]
            properties:
              id: {type: string}
              name: {type: string, description: Greek name.}
              name_en: {type: string, description: "English name, may be empty."}
              color: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
              text_color: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
              kind: {type: string, enum: [bus, trolley]}

    StaticLine:
      type: object
      required: [id, variants, stops]
      properties:
        id:
          type: string
        variants:
          type: object
          description: By shape id (the live `variant`).
          additionalProperties:
            type: object
            required: [headsign, direction, shape, stops]
            properties:
              headsign: {type: string}
              direction: {type: integer, enum: [0, 1]}
              shape:
                type: array
                items:
                  $ref: "#/components/schemas/LatLon"
              stops:
                type: array
                description: Stop ids in order.
                items: {type: string}
        stops:
          type: object
          description: By GTFS `stop_id`.
          additionalProperties:
            type: object
            required: [name, lat, lon]
            properties:
              name: {type: string}
              lat: {type: number}
              lon: {type: number}

    LineSchedule:
      type: object
      required: [line, date, expired, source, directions]
      properties:
        line: {type: string}
        date: {type: string, format: date}
        source:
          type: string
          enum: [oasa-daily, gtfs]
          description: Where the times come from, OASA's daily schedule (today only) or the GTFS.
        expired:
          type: boolean
          description: The GTFS has expired; the times are the same weekday of the old timetable.
        directions:
          type: array
          items:
            type: object
            required: [direction, headsign, departures]
            properties:
              direction: {type: integer, enum: [0, 1]}
              headsign: {type: string}
              departures:
                type: array
                items:
                  type: object
                  required: [t, trip]
                  properties:
                    t: {type: string, description: "Departure from the first stop, `HH:MM`, may pass 24:00."}
                    trip: {type: string}
                    seen:
                      type: boolean
                      description: >-
                        Today only. `gtfs`: a bus of this run was matched. `oasa-daily`: a bus of the
                        line left the start of this direction from 3 min before to 20 min after `t`
                        (`false` once 20 min passed without one). Missing while unknown.

    StasyDepartures:
      type: object
      required: [stop, indicative, departures]
      properties:
        stop: {type: string}
        indicative: {type: boolean}
        departures:
          type: array
          items:
            type: object
            required: [line, route_color, headsign, t, in_s]
            properties:
              line: {type: string, example: M2}
              route_color: {type: string, example: "#e30613"}
              headsign: {type: string}
              t: {type: string, description: "`HH:MM`, may pass 24:00."}
              in_s: {type: integer, description: Seconds from now.}

    StasyPlace:
      type: object
      required: [name, lat, lon, at]
      properties:
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        at: {type: integer, description: "Unix seconds. Vehicle moving: `from` at its departure, `to` at its arrival. Vehicle standing at a stop: `from` and `to` are that stop, at its arrival and its departure. Trip: each stop's departure, the last stop's arrival."}

    StasyVehicles:
      type: object
      required: [updated_at, indicative, vehicles]
      properties:
        updated_at: {type: integer}
        indicative: {type: boolean}
        vehicles:
          type: array
          items:
            type: object
            required: [trip, line, route_color, headsign, from, to]
            properties:
              trip: {type: string}
              line: {type: string, example: M2}
              route_color: {type: string}
              headsign: {type: string}
              from: {$ref: "#/components/schemas/StasyPlace"}
              to: {$ref: "#/components/schemas/StasyPlace"}

    StasyTrip:
      type: object
      required: [trip, line, route_color, headsign, stops]
      properties:
        trip: {type: string}
        line: {type: string}
        route_color: {type: string}
        headsign: {type: string}
        stops:
          type: array
          items: {$ref: "#/components/schemas/StasyPlace"}

    SuburbanVehicles:
      type: object
      required: [updated_at, trains]
      properties:
        updated_at: {type: integer}
        trains:
          type: array
          items:
            type: object
            required: [train, corridor, service, lat, lon, course, speed_kmh, delay_min, from, to, next_station, position_at]
            properties:
              train: {type: string}
              corridor: {type: string, example: PIRAIR}
              service: {type: string, example: Suburban}
              lat: {type: number}
              lon: {type: number}
              course: {type: [number, "null"], description: Degrees from north.}
              speed_kmh: {type: number}
              delay_min: {type: [integer, "null"]}
              from: {type: string}
              to: {type: string}
              next_station: {type: string}
              position_at: {type: integer}

    StopArrivals:
      type: object
      required: [stop, lines, arrivals, updated_at]
      properties:
        stop:
          type: object
          required: [id, name, lat, lon]
          properties:
            id: {type: string}
            name: {type: string}
            lat: {type: number}
            lon: {type: number}
            code: {type: string, description: "Rev 21: the code on the stop sign (GTFS stop_code); missing when there is none."}
        lines:
          type: array
          items: {type: string}
        arrivals:
          type: array
          items:
            type: object
            required: [line, headsign, variant, vehicle, eta_s, at, delay_s, position_at, source, trip_id, scheduled, stops_away, distance_m]
            properties:
              line: {type: string}
              headsign: {type: string}
              variant: {type: string, description: "Shape id of the trip (`variants` key of the static line file); empty when the trip has no shape."}
              vehicle: {type: string, description: "Empty for `schedule`."}
              eta_s: {type: integer, minimum: 0}
              at: {type: integer, description: "Expected arrival, Unix seconds."}
              delay_s: {type: integer, description: "Positive = late; 0 for an unmatched bus and for `schedule`."}
              position_at: {type: integer, description: "Time of the bus's last GPS fix; 0 for `schedule`."}
              source: {type: string, enum: [live, schedule]}
              trip_id: {type: [string, "null"], description: "GTFS trip; null for an unmatched bus."}
              scheduled: {type: [integer, "null"], description: "The trip's timetable time at the stop, Unix seconds; null for an unmatched bus."}
              stops_away: {type: [integer, "null"], minimum: 1, description: "1 when the stop is the bus's next one; null for `schedule`."}
              distance_m: {type: [integer, "null"], minimum: 0, description: "Along the route; null for `schedule`."}
        usual:
          type: array
          description: |
            Contract rev 19: the usual service of each line and headsign here, as `/v2/stops/{id}`
            `usual` but with `line` as in `arrivals`. `[]` while the server has no history.
          items:
            $ref: "#/components/schemas/Usual"
        warming:
          type: boolean
          description: |
            Contract rev 22: `true` while a line in `lines` is polled now but has no poll yet
            (after a restart): its buses are missing from `arrivals`, so an empty board does not
            mean no bus is coming. Then `max-age=5`.
        updated_at: {type: integer}

    StopPredictions:
      type: object
      required: [stop_id, stop_name, updated_at, arrivals]
      properties:
        stop_id:
          type: string
        stop_name:
          type: string
          description: Stop name from the GTFS.
        updated_at:
          type: integer
          description: When OASA gave these predictions (Unix seconds).
        arrivals:
          type: array
          items:
            type: object
            required: [line, route_code, vehicle, minutes]
            properties:
              line:
                type: string
                description: Line number; empty when the route code is not in OASA's line list.
              route_code:
                type: string
                description: OASA route code (one direction or variant of the line).
              vehicle:
                type: string
                description: OASA vehicle number (`veh_code` of `getStopArrivals`).
              minutes:
                type: integer
                description: OASA's predicted minutes to arrival.

    SuburbanRun:
      type: object
      required: [train, from, to, status, delay_min, stops]
      properties:
        train: {type: string}
        from: {type: string}
        to: {type: string}
        status: {type: string}
        delay_min: {type: [integer, "null"]}
        stops:
          type: array
          items:
            type: object
            required: [id, name, t, at, platform, delay_min]
            properties:
              id: {type: string}
              name: {type: string}
              t: {type: string, description: "Scheduled arrival, `HH:MM` Athens local."}
              at: {type: integer}
              platform: {type: [string, "null"]}
              delay_min: {type: [integer, "null"]}

    SuburbanStation:
      type: object
      required: [id, name, corridors]
      properties:
        id: {type: string}
        name: {type: string}
        corridors:
          type: array
          items: {type: string}

    SuburbanDepartures:
      type: object
      required: [station, departures]
      properties:
        station: {type: string}
        departures:
          type: array
          items:
            type: object
            required: [train, from, to, t, delay_min, platform, status]
            properties:
              train: {type: string}
              from: {type: string}
              to: {type: string}
              t: {type: string, description: "Scheduled time, `HH:MM` Athens local."}
              delay_min: {type: [integer, "null"]}
              platform: {type: [string, "null"]}
              status: {type: string}

    SourceState:
      type: object
      description: How fresh one Source is. Every list answer carries its Sources.
      required: [id, state, updated_at]
      properties:
        id:
          type: string
          enum: [oasa, stasy, proastiakos]
        state:
          type: string
          enum: [ok, warming_up, stale, indicative, down]
          description: |
            `ok`; `warming_up` while it loads; `stale` while its last good data is served;
            `indicative` when its timetable is expired and the same weekday stands in; `down`
            when it has no data at all.
        updated_at:
          type: [integer, "null"]
          description: Last good data of that Source (fix, stream event, board, timetable load); `null` when it has none.

    Line:
      type: object
      description: A line of any mode, one shape for every Source.
      required: [id, mode, label, name, name_en, color, text_color, source]
      properties:
        id:
          type: string
          description: |
            Namespaced id, percent-encoded in URLs: `oasa:040`, `stasy:M1`,
            `proastiakos:PIRAIR`. Opaque: store and compare it, never parse it.
        mode:
          type: string
          enum: [bus, trolley, metro, tram, suburban]
        label:
          type: [string, "null"]
          description: |
            Short public code for the badge (`040`, `M1`). `null` when the Source has none: the
            badge is then the mode icon on `color` with `name`.
        name:
          type: string
          description: Always present, in Greek.
        name_en:
          type: [string, "null"]
          description: "`null` when the Source has no English name."
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Background of the badge; the adapter's default per mode when the Source has none.
        text_color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Text on `color`.
        source:
          type: string
          enum: [oasa, stasy, proastiakos]

    Stop:
      type: object
      description: A stop or station; one per name and mode for STASY platforms.
      required: [id, name, name_en, lat, lon, modes, lines, source]
      properties:
        id:
          type: string
          description: |
            Namespaced id, percent-encoded in URLs: `oasa:400012`, `stasy:συνταγμα-metro`,
            `proastiakos:<station id>`.
        name:
          type: string
          description: Always present, in Greek.
        name_en:
          type: [string, "null"]
          description: "`null` when the Source has no English name."
        code:
          type: string
          description: |
            Rev 21: the code on the stop sign (GTFS `stop_code`), e.g. `040054` for `oasa:40054`.
            OASA Stops only; missing otherwise.
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: The mean of the platforms for a merged station, 5 decimals.
        lon:
          type: number
          minimum: -180
          maximum: 180
        modes:
          type: array
          description: The modes of `lines`, sorted.
          items:
            type: string
            enum: [bus, trolley, metro, tram, suburban]
        lines:
          type: array
          description: Line ids that call here, by mode then label/name.
          items: {type: string}
        source:
          type: string
          enum: [oasa, stasy, proastiakos]

    StopIndexEntry:
      type: array
      description: |
        `[id, name, lat, lon, modes, lines]`: the compact row of `/v2/stops`.
      prefixItems:
        - type: string
          description: Stop id.
        - type: string
          description: Greek name.
        - type: number
          minimum: -90
          maximum: 90
        - type: number
          minimum: -180
          maximum: 180
        - type: array
          items:
            type: string
            enum: [bus, trolley, metro, tram, suburban]
        - type: array
          items: {type: string}
      minItems: 6
      maxItems: 6

    Pattern:
      type: object
      description: One direction of a Line and the path it follows.
      required: [id, headsign, direction, stops, shape]
      properties:
        id:
          type: string
          description: |
            Pattern id (`oasa:2045`, `stasy:M2-0`). Not stored by clients: a new timetable may
            renumber it.
        headsign:
          type: string
          description: The destination a passenger reads.
        direction:
          type: integer
          enum: [0, 1]
        stops:
          type: array
          description: Stop ids in order.
          items: {type: string}
        shape:
          type: array
          description: The path through the stops.
          items:
            $ref: "#/components/schemas/LatLon"

    Position:
      type: object
      description: Where a Vehicle is, and how that was known.
      required: [kind, lat, lon, bearing, at]
      properties:
        kind:
          type: string
          enum: [gps, estimate]
          description: "`gps` from a fix; `estimate` from the timetable (metro, tram)."
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        bearing:
          type: [number, "null"]
          minimum: 0
          maximum: 360
          description: Degrees clockwise from north. `null` when unknown.
        at:
          type: integer
          description: Time of the fix, or for an estimate the build time of the snapshot (Unix seconds).

    V2Motion:
      type: object
      description: |
        How a client moves the marker between snapshots. `null` on the Vehicle when there is
        nothing to move along.
      required: [path, path_beyond, path_stops, speed, path_speeds, knots]
      properties:
        path:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            The route ahead from the vehicle's point: to its next stop when matched, else
            `max(speed × 150 s, 300 m)` ahead, at most 1.5 km. An estimate runs to the next stop
            whatever the distance.
        path_beyond:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            The route on from the end of `path` to the third stop ahead (at most 1.5 km from
            the vehicle; no cap for an estimate). Its first point is the last point of `path`.
        path_stops:
          type: [array, "null"]
          items:
            type: integer
            minimum: 0
          description: The stops on `path` then `path_beyond`, as whole metres along them, ascending.
        speed:
          type: [number, "null"]
          minimum: 0
          description: |
            Smoothed speed along the route in m/s, one decimal. `0` = standing; `null` when
            unknown. No upper cap: a suburban train is faster than a bus.
        path_speeds:
          type: [array, "null"]
          maxItems: 8
          items:
            type: [number, "null"]
            minimum: 0.1
          description: Typical speed ahead in m/s for consecutive 200 m steps. `null` when unknown.
        knots:
          type: [array, "null"]
          description: |
            Estimates only (`null` for GPS vehicles): `[metres along path + path_beyond, unix
            time]` pairs. The first knot is `[0, position.at]`; each stop ahead gives an arrival
            and a departure knot. Metres never decrease, times strictly increase.
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: 0
              - type: integer
            minItems: 2
            maxItems: 2

    Vehicle:
      type: object
      description: A bus, trolley, metro or tram train, or a suburban train, in one shape.
      required: [id, line, run, mode, headsign, label, position, delay_s, next_stop, motion, source]
      properties:
        id:
          type: string
          description: |
            Namespaced id: `oasa:52134` (fleet no.), `proastiakos:1226` (train no.), and for
            metro and tram the Run itself (`stasy:run:<trip_id>:<date>`). Never stored.
        line:
          type: string
          description: Line id.
        run:
          type: [string, "null"]
          description: Run id; `null` when the vehicle is not matched to a Run.
        mode:
          type: string
          enum: [bus, trolley, metro, tram, suburban]
        headsign:
          type: [string, "null"]
          description: Destination; `null` when unknown (an unmatched bus that cannot be placed on a shape).
        label:
          type: [string, "null"]
          description: |
            What the passenger reads on the vehicle: fleet no. (`52134`), train no. (`1226`);
            `null` for metro and tram.
        position:
          $ref: "#/components/schemas/Position"
        delay_s:
          type: [integer, "null"]
          description: Observed delay in seconds (negative = early); `null` without a live signal.
        next_stop:
          type: [string, "null"]
          description: Stop id; `null` when unmatched.
        at_terminus:
          type: boolean
          description: |
            Rev 9: `true` when a bus or trolley is matched and waiting at the first Stop of its
            Run; always `false` for rail. Missing in older responses: treat as `false`.
        direction:
          type: [integer, "null"]
          enum: [0, 1, null]
          description: |
            Rev 12: the `direction` of the Pattern the vehicle runs, so a client can put it on
            one of a Line's two tracks without a `/v2/runs` call. Metro and tram: always set.
            Bus and trolley: the matched trip's direction, else the direction of the trip the
            bus was placed on, else `null`. Suburban: the direction of its Run when it has one,
            else of where it is placed on its corridor, else `null`. Older responses lack the
            key: treat a missing key as `null`.
        motion:
          description: "`null` when there is nothing to move along (standing with no Run, no geometry)."
          anyOf:
            - $ref: "#/components/schemas/V2Motion"
            - type: "null"
        source:
          type: string
          enum: [oasa, stasy, proastiakos]

    LiteVehicle:
      type: object
      description: |
        A Vehicle without `motion`: the key is absent, not `null` (tile zoom 9).
      required: [id, line, run, mode, headsign, label, position, delay_s, next_stop, source]
      properties:
        id: {type: string, description: "As `Vehicle`: `oasa:52134`, `proastiakos:1226`."}
        line: {type: string, description: Line id.}
        run: {type: [string, "null"], description: Run id; `null` when not matched.}
        mode:
          type: string
          enum: [bus, trolley, metro, tram, suburban]
        headsign: {type: [string, "null"]}
        label: {type: [string, "null"], description: Fleet or train number; `null` when unknown.}
        position:
          $ref: "#/components/schemas/Position"
        delay_s: {type: [integer, "null"], description: Observed delay in seconds; `null` without a live signal.}
        next_stop: {type: [string, "null"], description: Stop id; `null` when unmatched.}
        at_terminus: {type: boolean, description: "As `Vehicle`: waiting at the first Stop of its Run."}
        direction: {type: [integer, "null"], enum: [0, 1, null], description: "As `Vehicle` (rev 12)."}
        source:
          type: string
          enum: [oasa, stasy, proastiakos]

    Usual:
      type: object
      description: |
        The usual service of an OASA Line and headsign at a Stop (contract rev 19), from the bus
        passes of the days of the same day type in the last 28 days, at the same local time of
        day. Listed only with a `headway_min` or a `next_at`.
      required: [line, headsign, day_type, days, headway_min, next_hour_headway_min, next_at, spread_s]
      properties:
        line: {type: string, example: "oasa:309Β"}
        headsign: {type: string, example: ΑΥΛΑΚΙ}
        day_type:
          type: string
          enum: [weekday, saturday, sunday]
          description: Today's day type; Greek public holidays are `sunday`.
        days:
          type: integer
          description: Past days with a bus within 3 h of now.
        headway_min:
          type: [integer, "null"]
          description: Median gap between buses in this local hour, minutes (≥ 1), from at least 6 gaps.
        next_hour_headway_min:
          type: [integer, "null"]
          description: The same for the next local hour.
        next_at:
          type: [integer, "null"]
          description: |
            Usual time of the next pass (Unix seconds), only when at least 3 days had one within
            3 h, more than half of the readable days did, their waits differ by at most 3 min,
            and an Arrival of the same line and headsign is within 15 min of it. An estimate.
        spread_s:
          type: [integer, "null"]
          description: IQR of the past days' waits, seconds; `null` with `next_at`.
    Arrival:
      type: object
      description: A vehicle or a timetable trip on its way to a Stop.
      required: [line, stop, headsign, at, scheduled_at, delay_s, source, run, vehicle, vehicle_label, platform, status]
      properties:
        line:
          type: string
          description: Line id.
        stop:
          type: string
          description: Stop id.
        headsign:
          type: string
        at:
          type: integer
          description: |
            Expected time in Unix seconds (the leaving time for rail). Clamped to now when the
            vehicle is due, so never compute it from `scheduled_at` and `delay_s`.
        scheduled_at:
          type: [integer, "null"]
          description: The timetable time; `null` when the Source has no timetable for it.
        delay_s:
          type: [integer, "null"]
          description: Observed delay in seconds (negative = early); `null` without a live signal.
        source:
          type: string
          enum: [live, timetable]
          description: |
            `live` only when GPS, a reported delay or (rev 11, OASA stops) OASA's own prediction
            set `at`. An OASA prediction is listed only for a bus the backend has no Arrival of;
            it has `vehicle` set and `scheduled_at`, `delay_s`, `run` `null`.
        run:
          type: [string, "null"]
          description: Run id, so the card can open the Run before it starts; `null` for an OASA prediction.
        vehicle:
          type: [string, "null"]
          description: |
            Vehicle id; `null` when no vehicle is on the Run yet. Metro and tram: set only while
            the Run is under way.
        vehicle_label:
          type: [string, "null"]
          description: Fleet or train number; `null` for metro and tram.
        platform:
          type: [string, "null"]
          description: "`null` unless the Source gives one (railway.gov.gr today)."
        status:
          type: string
          enum: [scheduled, running, delayed]
          description: "`delayed` from 5 minutes of delay; `running` below that; `scheduled` without a live signal."

    RunStop:
      type: object
      description: One Stop of a Run and its time.
      required: [stop, scheduled_at, at, delay_s, source, platform, passed]
      properties:
        stop:
          type: string
          description: Stop id.
        scheduled_at:
          type: [integer, "null"]
          description: The timetable time; `null` when the Source has none for it.
        at:
          type: integer
          description: Expected time in Unix seconds (never before now ahead of the vehicle).
        delay_s:
          type: [integer, "null"]
          description: Observed delay in seconds; `null` without a live signal.
        source:
          type: string
          enum: [live, timetable]
        platform:
          type: [string, "null"]
        passed:
          type: boolean
          description: The stop is behind the vehicle (or its timetable time is past for rail).

    Run:
      type: object
      description: One vehicle's or trip's journey of the day, with every stop.
      required: [id, line, headsign, pattern, vehicle, vehicle_label, status, stops]
      properties:
        id:
          type: string
          description: "`<namespace>:run:<native>:<YYYY-MM-DD>`; lives only for its service day."
        line:
          type: string
          description: Line id.
        headsign:
          type: string
        pattern:
          type: [string, "null"]
          description: Pattern id; `null` when the Run's stop sequence is not a Pattern.
        vehicle:
          type: [string, "null"]
          description: Vehicle id; `null` before the Run starts or when no vehicle is known.
        vehicle_label:
          type: [string, "null"]
          description: Fleet or train number; `null` when unknown.
        status:
          type: string
          enum: [scheduled, running, delayed]
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RunStop"

    LinesResponse:
      type: object
      required: [lines, sources]
      properties:
        lines:
          type: array
          description: Every Line of every Source, sorted by `id`.
          items:
            $ref: "#/components/schemas/Line"
        sources:
          type: array
          description: State of every Source.
          items:
            $ref: "#/components/schemas/SourceState"

    LineDetailResponse:
      type: object
      required: [line, patterns, stops, sources]
      properties:
        line:
          description: "`null` while its Source has not loaded yet (never `404` then)."
          anyOf:
            - $ref: "#/components/schemas/Line"
            - type: "null"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/Pattern"
        stops:
          type: object
          description: By Stop id.
          additionalProperties:
            $ref: "#/components/schemas/Stop"
        sources:
          type: array
          description: State of that one Source.
          items:
            $ref: "#/components/schemas/SourceState"

    LineVehiclesResponse:
      type: object
      required: [line, updated_at, next_update_at, vehicles, sources]
      properties:
        line:
          type: string
          description: Canonical Line id.
        updated_at:
          type: integer
          description: Time of the poll or build that gave this data.
        next_update_at:
          type: integer
          description: Earliest time new data can exist. Refetch then, not earlier.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        sources:
          type: array
          description: State of that one Source.
          items:
            $ref: "#/components/schemas/SourceState"

    StopsResponse:
      type: object
      required: [stops, sources]
      properties:
        stops:
          type: array
          description: Every Stop of every Source, sorted by id.
          items:
            $ref: "#/components/schemas/StopIndexEntry"
        sources:
          type: array
          description: State of every Source.
          items:
            $ref: "#/components/schemas/SourceState"

    StopDetailResponse:
      type: object
      required: [stop, lines, arrivals, usual, updated_at, sources]
      properties:
        stop:
          description: "`null` while its Source has not loaded yet (never `404` then)."
          anyOf:
            - $ref: "#/components/schemas/Stop"
            - type: "null"
        lines:
          type: array
          description: The Lines that call here, by mode then label/name.
          items:
            $ref: "#/components/schemas/Line"
        arrivals:
          type: array
          description: Soonest first; at most 2 h ahead, 4 per Line and headsign, 30 in all.
          items:
            $ref: "#/components/schemas/Arrival"
        usual:
          type: array
          description: |
            The usual service of each OASA Line and headsign at the Stop, learnt from the past
            weeks (contract rev 19). `[]` for other Sources and while the server has no history.
          items:
            $ref: "#/components/schemas/Usual"
        updated_at:
          type: integer
          description: Build time of the answer.
        sources:
          type: array
          description: State of that one Source.
          items:
            $ref: "#/components/schemas/SourceState"

    V2VehiclesResponse:
      type: object
      description: The body of `/v2/vehicles`, `/v2/vehicles/rail` and `/v2/vehicles/suburban`.
      required: [updated_at, next_update_at, vehicles, sources]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot.
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        sources:
          type: array
          description: State of the Sources the snapshot draws on.
          items:
            $ref: "#/components/schemas/SourceState"

    V2TileResponse:
      type: object
      required: [updated_at, next_update_at, vehicles, sources]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot (the same as `/v2/vehicles`).
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          description: "`Vehicle` entries in `z` 13 tiles, `LiteVehicle` entries in `z` 9 tiles."
          items:
            anyOf:
              - $ref: "#/components/schemas/Vehicle"
              - $ref: "#/components/schemas/LiteVehicle"
        sources:
          type: array
          description: State of the Sources the snapshot draws on.
          items:
            $ref: "#/components/schemas/SourceState"

    RunResponse:
      type: object
      required: [run, sources]
      properties:
        run:
          description: "`null` while its Source has not loaded yet (never `404` then)."
          anyOf:
            - $ref: "#/components/schemas/Run"
            - type: "null"
        sources:
          type: array
          description: State of that one Source.
          items:
            $ref: "#/components/schemas/SourceState"

    PlanPoint:
      type: object
      description: A query point as given.
      required: [lat, lon]
      properties:
        lat: {type: number}
        lon: {type: number}

    PlanPlace:
      type: object
      required: [stop, lat, lon]
      properties:
        stop:
          description: The Stop id; `null` at the query points.
          type: [string, "null"]
        lat: {type: number}
        lon: {type: number}

    PlanWalk:
      type: object
      required: [kind, from, to, depart_at, arrive_at, distance_m, shape]
      properties:
        kind: {type: string, enum: [walk]}
        from: {$ref: "#/components/schemas/PlanPlace"}
        to: {$ref: "#/components/schemas/PlanPlace"}
        depart_at: {type: integer, format: int64}
        arrive_at:
          type: integer
          format: int64
          description: "`depart_at` + the walk's time (`distance_m` / 1.2 m/s rounded up, + 120 s at a metro or suburban Stop)."
        distance_m:
          type: integer
          description: Straight line × 1.3, whole metres; 0 at a change inside one Stop.
        shape:
          type: array
          description: The straight line from `from` to `to` (2 points; a later rev may follow the streets).
          items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}

    PlanRide:
      type: object
      required: [kind, line, mode, headsign, run, from, to, depart_at, arrive_at, hops, source, shape]
      properties:
        kind: {type: string, enum: [ride]}
        line: {type: string}
        mode: {type: string, enum: [bus, trolley, metro, tram, suburban]}
        headsign: {type: string}
        run:
          type: string
          description: The Run id; `/v2/runs/{id}` gives its live state until 03:00 after the service day.
        from: {$ref: "#/components/schemas/PlanPlace"}
        to: {$ref: "#/components/schemas/PlanPlace"}
        depart_at: {type: integer, format: int64, description: "The timetable departure from `from`."}
        arrive_at: {type: integer, format: int64, description: "The timetable arrival at `to`."}
        hops: {type: integer, description: "Stops the ride moves past, the last one included."}
        source: {type: string, enum: [timetable]}
        shape:
          type: array
          description: |
            The Pattern shape cut from the board Stop to the alight Stop; the Stops' own points
            when the Pattern has none. 5 decimals; the first and last points are `from` and `to`.
          items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}

    Itinerary:
      type: object
      required: [depart_at, arrive_at, duration_s, transfers, walk_m, modes, legs]
      properties:
        depart_at: {type: integer, format: int64, description: "Start of the first walk."}
        arrive_at: {type: integer, format: int64, description: "End of the last walk."}
        duration_s: {type: integer}
        transfers: {type: integer, description: "Rides − 1 (0-3)."}
        walk_m: {type: integer, description: "Sum of the walks."}
        modes:
          type: array
          description: The Modes of the rides, in ride order, without repeats.
          items: {type: string}
        legs:
          type: array
          description: Walk, ride, walk, …, walk (always odd, walks at both ends).
          items:
            oneOf:
              - $ref: "#/components/schemas/PlanWalk"
              - $ref: "#/components/schemas/PlanRide"
            discriminator:
              propertyName: kind
              mapping:
                walk: "#/components/schemas/PlanWalk"
                ride: "#/components/schemas/PlanRide"

    PlanResponse:
      type: object
      required: [service_day, from, to, after, last, itineraries, walk_only, lines, stops, sources]
      properties:
        service_day:
          type: string
          format: date
          description: The service day (03:00 to 03:00) whose timetable answered.
        from: {$ref: "#/components/schemas/PlanPoint"}
        to: {$ref: "#/components/schemas/PlanPoint"}
        after: {type: integer, format: int64}
        last: {type: boolean}
        itineraries:
          type: array
          items: {$ref: "#/components/schemas/Itinerary"}
        walk_only:
          description: The walk from `from` to `to` when they are at most 1000 m apart (straight line), else `null`.
          anyOf:
            - type: object
              required: [distance_m, duration_s]
              properties:
                distance_m: {type: integer}
                duration_s: {type: integer}
            - type: "null"
        lines:
          type: object
          description: Every Line a ride names, by id.
          additionalProperties: {$ref: "#/components/schemas/Line"}
        stops:
          type: object
          description: Every Stop a leg names, by id.
          additionalProperties: {$ref: "#/components/schemas/Stop"}
        sources:
          type: array
          description: All three Sources. `oasa` is `warming_up` while its GTFS is expired and no daily schedule of the service day is cached.
          items: {$ref: "#/components/schemas/SourceState"}

    Alert:
      type: object
      description: A service disruption of `/v2/alerts` (rev 13).
      required: [id, source, title, url, published, from, until, modes, lines, stops, urgent]
      properties:
        id:
          type: string
          description: "`oasa:<post id>` or `athenstransport:<post id>`. Not stored by clients."
        source:
          type: string
          enum: [oasa, athenstransport]
        title:
          type: string
          description: The notice's or the post's title.
        url:
          type: string
          description: The notice page or the news post. Clients always link it.
        published:
          type: integer
          description: Unix seconds.
        from:
          type: [string, "null"]
          description: |
            First day the disruption applies, Athens `YYYY-MM-DD`; `null` when the notice names
            none (clients then show it for 3 days after `published`).
        until:
          type: [string, "null"]
          description: Last day it applies, Athens `YYYY-MM-DD`; `null` as `from`.
        modes:
          type: array
          description: |
            `bus` for an OASA notice, plus `trolley` when one of its Lines is a trolley line
            (both when it names no Line). From the post's categories for athenstransport.com;
            none of them means every mode.
          items:
            type: string
            enum: [bus, trolley, metro, tram, suburban]
        lines:
          type: array
          description: |
            Line ids that follow «γραμμή»/«γραμμών» in the title, only those of the GTFS; `[]`
            for a network-wide notice and for athenstransport.com.
          items: {type: string}
        stops:
          type: array
          description: Stop ids of the «ΚΣ <code>» codes in the notice, only those of the GTFS.
          items: {type: string}
        urgent:
          type: boolean
          description: "`true` for a strike."

    MunicipalRoute:
      type: object
      description: A municipal bus route of `/v2/municipal` (rev 18), one OSM route relation.
      required: [id, ref, name, municipality, timetable_url, shape, stops]
      properties:
        id:
          type: string
          description: "`osm:r<relation id>`."
        ref:
          type: [string, "null"]
          description: The line's short name; `null` when OSM has none.
        name:
          type: string
        municipality:
          type: string
          description: The operator, spaces normalised («Δήμος Παπάγου-Χολαργού»).
        timetable_url:
          type: [string, "null"]
          description: The municipality's page with the routes and times; `null` when unknown.
        shape:
          type: array
          description: Lines of `[lat, lon]` pairs, 5 decimals; one line or a few.
          items:
            type: array
            items:
              type: array
              items: {type: number}
              minItems: 2
              maxItems: 2
        stops:
          type: array
          description: Stop ids (`osm:n<node id>`) in route order; `[]` when OSM has none.
          items: {type: string}

    MunicipalStop:
      type: object
      required: [name, lat, lon]
      properties:
        name:
          type: [string, "null"]
        lat:
          type: number
        lon:
          type: number

    MunicipalResponse:
      type: object
      description: The body of `/v2/municipal`.
      required: [routes, stops, updated_at, attribution]
      properties:
        routes:
          type: array
          description: By municipality, then ref, then name.
          items:
            $ref: "#/components/schemas/MunicipalRoute"
        stops:
          type: object
          description: Every Stop listed by a route, by id.
          additionalProperties:
            $ref: "#/components/schemas/MunicipalStop"
        updated_at:
          type: [integer, "null"]
          description: Unix seconds of the last good poll; `null` before the first.
        attribution:
          type: string
          description: The ODbL credit to show with the layer.

    AlertsResponse:
      type: object
      description: The body of `/v2/alerts`.
      required: [alerts, updated_at]
      properties:
        alerts:
          type: array
          description: Newest `published` first.
          items:
            $ref: "#/components/schemas/Alert"
        updated_at:
          type: [integer, "null"]
          description: |
            Unix seconds of the last poll with no failure; `null` (and `alerts: []`) before the
            first one. A Source that fails keeps its last Alerts.
